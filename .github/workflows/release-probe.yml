# Временная проверка: та же команда создания релиза, что у сборки программы (после проверки файл удаляется)
# Название
name: release-probe
# Только вручную
on: workflow_dispatch
# Права как у сборки программы
permissions:
  # Запись содержимого
  contents: write
# Задачи
jobs:
  # Проверка на Windows и Linux
  probe:
    # Обе системы
    strategy: { matrix: { os: [windows-latest, ubuntu-24.04] }, fail-fast: false }
    # Машина
    runs-on: ${{ matrix.os }}
    # Шаги
    steps:
      # Пробные варианты
      - name: Пробы
        # PowerShell на обеих системах
        shell: pwsh
        # Токен
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        # Сценарий
        run: |
          # Ровно тот тег, что у программы (если получится — релиз оставляем, сборка заполнит его файлами)
          if ($env:RUNNER_OS -ne "Windows") { exit 0 }
          # Попытка
          $out = gh release create desktop-latest --title "Нитеграф для Windows (идёт сборка)" --notes "Файлы появятся после сборки." --target $env:GITHUB_SHA --latest 2>&1
          # Итог аннотацией
          Write-Host "::notice title=desktop-latest::rc=$LASTEXITCODE $(($out | Out-String).Trim())"
          # Успех шага в любом случае
          exit 0
