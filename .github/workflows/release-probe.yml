# Временная проверка: может ли токен Actions создавать релизы (после проверки файл удаляется)
# Название
name: release-probe
# Только вручную
on: workflow_dispatch
# Права как у сборки программы
permissions:
  # Запись содержимого (релизы и теги)
  contents: write
# Задачи
jobs:
  # Проверка
  probe:
    # Машина
    runs-on: ubuntu-24.04
    # Шаги
    steps:
      # Код (для git)
      - uses: actions/checkout@v5
      # Попытки
      - name: Создать и удалить пробный релиз
        # Токен для gh
        env: { GH_TOKEN: "${{ github.token }}" }
        # Сценарий
        run: |
          # Пробный тег
          T="probe-${{ github.run_id }}"
          # Черновик (без тега)
          out=$(gh release create "$T-draft" --draft --notes probe 2>&1); echo "::notice title=draft::rc=$? $out"
          # Релиз с новым тегом
          out=$(gh release create "$T" --notes probe --target "$GITHUB_SHA" 2>&1); echo "::notice title=release::rc=$? $out"
          # Тег через git
          git tag "$T-git" && out=$(git push origin "refs/tags/$T-git" 2>&1); echo "::notice title=git-tag::rc=$? $out"
          # Уборка
          gh release delete "$T-draft" --yes 2>/dev/null; gh release delete "$T" --yes --cleanup-tag 2>/dev/null; git push --delete origin "$T-git" 2>/dev/null; true
