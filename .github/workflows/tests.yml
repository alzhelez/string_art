# Автотесты на GitHub Actions: запускаются на каждый push и pull request.
# Результаты — во вкладке Actions репозитория. Allure-результаты Java лежат в артефактах.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Python · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest

  frontend:
    name: TypeScript · Vitest + сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run typecheck && npm test && npm run build

  e2e:
    name: Playwright · UI + API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test
        env: { CI: "true", PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: frontend/playwright-report }

  api:
    name: API-тесты · ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [java, go, ruby, csharp]
    env: { STRINGART_API: "http://127.0.0.1:8000" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Запуск бэкенда
        run: sh autotests/ci/start-backend.sh
      - if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - if: matrix.lang == 'java'
        run: cd autotests/java && mvn -B test -Dapi.baseUrl=$STRINGART_API
      - if: matrix.lang == 'java' && always()
        uses: actions/upload-artifact@v4
        with: { name: allure-results, path: autotests/java/target/allure-results }
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - if: matrix.lang == 'go'
        run: cd autotests/go && go test -v ./...
      - if: matrix.lang == 'ruby'
        uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - if: matrix.lang == 'ruby'
        run: ruby autotests/ruby/api_test.rb
      - if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - if: matrix.lang == 'csharp'
        run: cd autotests/csharp && dotnet test
