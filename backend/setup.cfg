# Мутационное тестирование бэкенда (mutmut 3): в код вносятся маленькие «поломки» — «<» вместо «<=»,
# «+» вместо «−», другое число — и проверяется, что pytest это замечает. Выживший мутант — место,
# где тесты не проверяют поведение. Запуск из папки backend: mutmut run, затем mutmut results.
# Долго, поэтому в CI — отдельный процесс .github/workflows/mutation.yml раз в неделю и вручную.

# Раздел настроек mutmut
[mutmut]
# Код приложения (копируется целиком, вместе с моделями и шрифтами)
source_paths = app/
# Что НЕ «ломаем»: расчёт картины, фото, PDF и API — их тесты долгие, а поведение проверяют обычные прогоны.
# Остаются: геометрия гвоздей, леска и катушка, нити и доски, файл проекта, обновление программы
do_not_mutate =
    app/__init__.py
    app/algorithm.py
    app/config.py
    app/image_prep.py
    app/layers.py
    app/main.py
    app/pdf.py
    app/photo.py
    app/render.py
    app/similarity.py
    app/storage.py
    app/template.py
# «Ломаем» только строки, через которые проходят тесты (остальные заведомо выживут)
mutate_only_covered_lines = true
# Какие тесты запускать: быстрые наборы этих модулей
pytest_add_cli_args_test_selection =
    tests/test_geometry.py
    tests/test_thread.py
    tests/test_colors.py
    tests/test_transfer.py
    tests/test_updater.py
    tests/test_mutation_gaps.py
